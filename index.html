<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kalkulator Baris & Deret Geometri</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
</head>
<body>
    <div class="container">
        <header>
            <h1>Kalkulator Baris & Deret Geometri</h1>
            <p>Mendukung akar () dan pangkat</p>
        </header>

        <div class="tabs">
            <button class="tab-btn active" onclick="switchTab('baris')">Baris Geometri</button>
            <button class="tab-btn" onclick="switchTab('deret')">Deret Geometri</button>
        </div>

        <div id="baris-tab" class="tab-content active">
            <div class="input-group">
                <label>Suku Pertama (a):</label>
                <input type="text" id="suku1" placeholder="Contoh: 2, sqrt(4), 2^3">
            </div>
            <div class="input-group">
                <label>Rasio (r):</label>
                <input type="text" id="rasio" placeholder="Contoh: 3, sqrt(9), 2^2">
            </div>
            <div class="input-group">
                <label>Suku ke-n (n):</label>
                <input type="number" id="n" placeholder="Contoh: 5">
            </div>
            <button onclick="hitungBaris()">Hitung Suku ke-n</button>
        </div>

        <div id="deret-tab" class="tab-content">
            <div class="input-group">
                <label>Suku Pertama (a):</label>
                <input type="text" id="deret_a" placeholder="Contoh: 2, sqrt(4), 2^3">
            </div>
            <div class="input-group">
                <label>Rasio (r):</label>
                <input type="text" id="deret_r" placeholder="Contoh: 3, sqrt(9), 2^2">
            </div>
            <div class="input-group">
                <label>Jumlah Suku (n):</label>
                <input type="number" id="deret_n" placeholder="Contoh: 5">
            </div>
            <button onclick="hitungDeret()">Hitung Jumlah Suku</button>
        </div>

        <div id="hasil"></div>

        <div class="symbols">
            <h4>Tombol Cepat:</h4>
            <div class="symbol-grid">
                <button onclick="insertSimbol('sqrt(')">sqrt</button>
                <button onclick="insertSimbol('^')">x^n</button>
                <button onclick="insertSimbol('(')">(</button>
                <button onclick="insertSimbol(')')">)</button>
            </div>
            <p class="hint">Format: sqrt(4)=2, 2^3=8, 3sqrt(8)=2</p>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
