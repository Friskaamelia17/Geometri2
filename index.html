<div id="deret-tab" class="tab-content">
    <div class="input-group">
        <label>Suku Pertama (a):</label>
        <div class="input-wrapper">
            <input type="text" id="deret_a" placeholder="Contoh: 2, √4, 2^3, ³√8" autocomplete="off">
            <span class="input-icon">📝</span>
        </div>
        <small class="input-hint">Bisa gunakan: √4, sqrt(4), 2^3, ³√8, 4^(1/2)</small>
    </div>

    <div class="input-group">
        <label>Rasio (r):</label>
        <div class="input-wrapper">
            <input type="text" id="deret_r" placeholder="Contoh: 3, √9, 2^2, ⁴√16" autocomplete="off">
            <span class="input-icon">📝</span>
        </div>
        <small class="input-hint">Bisa gunakan: √9, sqrt(9), 2^2, ⁴√16, 4^(1/2)</small>
    </div>

    <div class="input-group">
        <label>Suku yang dicari (n untuk Un):</label>
        <div class="input-wrapper">
            <input type="number" id="deret_n_un" placeholder="Contoh: 4" min="1">
            <span class="input-icon">🔢</span>
        </div>
    </div>

    <div class="input-group">
        <label>Jumlah Suku (n untuk Sn):</label>
        <div class="input-wrapper">
            <input type="number" id="deret_n_sn" placeholder="Contoh: 5" min="1">
            <span class="input-icon">🔢</span>
        </div>
    </div>

    <button class="calc-btn" onclick="hitungDeret()">Hitung Un & Sn</button>
</div>
